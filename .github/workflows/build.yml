name: Build Desktop App EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE File
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "PDF_Organizer" app.py

    - name: Upload Executable App
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Organizer-Windows-App
        path: dist/PDF_Organizer/
